# Cache rules mirror public/_headers (Cloudflare), for a plain nginx server.
# The page and update metadata must stay fresh; hashed assets can be cached forever.
map $uri $sg_cache_control {
    default                 "no-cache";
    ~^/assets/              "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $sg_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src https: http:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # The OpenCascade geometry kernel is WebAssembly; it needs the right MIME type.
    location ~ \.wasm$ { types { application/wasm wasm; } }

    # Cloudflare's "single-page-application" not-found handling, on plain nginx.
    location / { try_files $uri $uri/ /index.html; }
}
