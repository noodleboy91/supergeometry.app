# Server storage: projects are mirrored to /data in a named volume, so they can
# be opened from any browser. Put Cloudflare Access in front.
services:
  supergeometry:
    build: .
    image: supergeometry:server
    container_name: supergeometry
    restart: unless-stopped
    environment:
      STORAGE: server
    volumes:
      - supergeometry-data:/data
    ports:
      - "${SUPERGEOMETRY_PORT:-3103}:3103"

volumes:
  supergeometry-data:
